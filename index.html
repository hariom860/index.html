<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Game</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" 
        crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="stone.css">
</head>
<body class="text-center">
<img src = "background.jpg" class="img-fluid rounded">
    <div class="container mt-5">
        <h1 class="mb-4">Stone Paper Scissors</h1>

        <div class="row justify-content-center">
            <div class="col-md-4 d-flex justify-content-around">
                <div class="choice" id="rock">
                    <img src="rock.png" class="img-fluid rounded">
                </div>
                <div class="choice" id="paper">
                    <img src="paper.png" class="img-fluid rounded">
                </div>
                <div class="choice" id="scissors">
                    <img src="scissors.png" class="img-fluid rounded">
                </div>
            </div>
        </div>

        <div class="score-board mt-4 d-flex justify-content-center gap-5">
            <div class="score text-center">
                <p id="user-score" class="fs-2 fw-bold">0</p>
                <p class="fw-semibold">YOU</p>
            </div>
            <div class="score text-center">
                <p id="computer-score" class="fs-2 fw-bold">0</p>
                <p class="fw-semibold">Com</p>
            </div>
        </div>

        <div class="msg-container mt-3">
            <p id="msg" class="fs-4 fw-semibold">PLAY YOUR GAME</p>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
        crossorigin="anonymous"></script>

    <script src="stone.js"></script>
</body>
</html>
